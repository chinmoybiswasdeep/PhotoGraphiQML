name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'photographiq @ git+https://github.com/chinmoybiswasdeep/PhotoGraphiQ.git@f15957d297f65f1e4761007e189f11119282dfdd'
      - run: python -m pip install -e '.[dev,docs]'
      - run: python scripts/validate_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.python }}
          path: |
            coverage.json
            validation-results.json
            dist/
  mentpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'photographiq @ git+https://github.com/chinmoybiswasdeep/PhotoGraphiQ.git@f15957d297f65f1e4761007e189f11119282dfdd'
      - run: python -m pip install -e '.[dev,docs]' -r tests/mentpy_reference/requirements.txt
      - run: python -m pytest tests/mentpy_reference -v
