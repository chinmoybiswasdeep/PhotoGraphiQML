[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "photographiqml"
version = "0.1.0"
description = "Logical MuTA models and a controlled photonic GKP research bridge"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["photographiq>=0.3.0,<0.4", "numpy>=1.26", "scipy>=1.12", "networkx>=3.2"]

[project.optional-dependencies]
validation = ["mentpy==0.1.0a15"]
visualization = ["matplotlib>=3.8"]
experiments = ["matplotlib>=3.8", "scikit-learn>=1.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2"]
docs = ["mkdocs>=1.6,<2", "matplotlib>=3.8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/photographiqml"]

[tool.hatch.build.targets.sdist]
exclude = ["/.references", "/.venv", "/papers", "/site", "/.git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/photographiqml"]
ignore_missing_imports = true
check_untyped_defs = true
